name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'supabase/' \
            --exclude 'tools/' \
            --exclude 'test/'
          jq -n \
            --arg supabaseUrl "$SUPABASE_URL" \
            --arg supabasePublishableKey "$SUPABASE_PUBLISHABLE_KEY" \
            '{supabaseUrl:$supabaseUrl,supabasePublishableKey:$supabasePublishableKey}' \
            > /tmp/aniwatch-config.json
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL repository variable/secret" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY repository variable/secret" && exit 1)
          printf 'export const RUNTIME_CONFIG = Object.freeze(%s);\n' "$(cat /tmp/aniwatch-config.json)" > _site/src/runtime-config.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
